<!DOCTYPE html>
<html lang="en">
<head>
<title>DevOps Test Platform</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Load safe, reliable WebGL library via official CDN -->
<script src="https://cloudflare.com"></script>
<style>
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(-45deg, #05070f, #0a081a, #140526, #05070f);
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
    margin: 0;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 95vh;
    overflow: hidden;
    color: #f8fafc;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    background: rgba(255, 255, 255, 0.02);
    backdrop-filter: blur(35px);
    -webkit-backdrop-filter: blur(35px);
    padding: 30px;
    max-width: 460px;
    width: 100%;
    margin: auto;
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 50px 100px -25px rgba(0, 0, 0, 0.85);
    text-align: center;
    position: relative;
    z-index: 10;
}
h2 {
    font-size: 32px;
    margin: 0 0 20px 0;
    background: linear-gradient(to right, #38bdf8, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
    letter-spacing: -0.5px;
}

h3 {
    color: #94a3b8;
    font-size: 19px;
    margin-bottom: 25px;
    font-weight: 500;
}

input {
    padding: 14px 18px;
    width: 82%;
    max-width: 320px;
    border-radius: 14px;
    border: 2px solid rgba(255, 255, 255, 0.06);
    background: rgba(4, 6, 12, 0.75);
    color: #fff;
    font-size: 16px;
    margin: 10px 0;
    outline: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
input::placeholder { color: #475569; }
input:focus {
    border-color: #38bdf8;
    background: rgba(4, 6, 12, 0.9);
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
}
button {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    border: none;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
    margin: 8px;
    box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
button:hover {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
}

.hidden { display: none !important; }
.section { margin-top: 5px; }

/* 🌟 REAL 3D VIEWPORT CONTAINER ABOVE THE TASKBAR */
.canvas-3d-viewport {
    width: 100%;
    height: 240px;
    margin-top: 20px;
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: radial-gradient(circle at center, rgba(56, 189, 248, 0.05) 0%, transparent 75%);
}
#threeJsCanvas {
    width: 100%;
    height: 100%;
    display: block;
}

#countdownOverlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(4, 6, 12, 0.99);
    backdrop-filter: blur(35px); z-index: 99999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
}
#countdownOverlay.active { opacity: 1; pointer-events: auto; }
.countdown-number { font-size: 140px; font-weight: 900; color: #38bdf8; text-shadow: 0 0 50px rgba(56, 189, 248, 0.4); }
.wish-text { font-size: 48px; font-weight: 900; background: linear-gradient(to right, #fbbf24, #f87171, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
    <h2>DevOps Test Platform</h2>

    <!-- STEP 1: USER INPUT -->
    <div id="userForm" class="section">
        <input type="text" id="name" placeholder="Enter Name" onfocus="triggerBoyExpression('look-down')" onblur="triggerBoyExpression('walk')">
        <input type="text" id="surname" placeholder="Enter Surname" onfocus="triggerBoyExpression('look-down')" onblur="triggerBoyExpression('walk')">
        <br>
        <button onclick="goToSelection()">Next</button>
    </div>

    <!-- STEP 2: TEST SELECTION -->
    <div id="testSelection" class="section hidden">
        <h3>Select Test</h3>
        <button onclick="selectTest('aws')">AWS Test</button>
        <button onclick="selectTest('linux')">Linux Test</button>
        <button onclick="selectTest('devops')">DevOps Test</button>
    </div>

    <!-- STEP 3: DEVOPS OPTIONS -->
    <div id="devopsOptions" class="section hidden">
        <h3>Select DevOps Tool</h3>
        <button onclick="selectDevops('git')">Git</button>
        <button onclick="selectDevops('docker')">Docker</button>
        <button onclick="selectDevops('kubernetes')">Kubernetes</button>
        <button onclick="selectDevops('terraform')">Terraform</button>
        <button onclick="selectDevops('jenkins')">Jenkins</button>
        <button onclick="selectDevops('all')">All DevOps</button>
    </div>

    <!-- STEP 4: START -->
    <div id="startSection" class="section hidden">
        <h3 id="selectedTestText"></h3>
        <button onclick="startTest()">Start Test</button>
    </div>

    <!-- 🌟 TASKBAR LOCATION VIEWPORT FOR RELIABLE 3D RENDERING -->
    <div class="canvas-3d-viewport">
        <div id="threeJsCanvas"></div>
    </div>
</div>

<div id="countdownOverlay">
    <div id="countdownDisplay" class="countdown-number">3</div>
    <div id="wishTextDisplay" class="wish-text hidden">ALL THE BEST! 🚀</div>
</div>

<script src="script.js"></script>
<script>
let scene, camera, renderer, characterGroup;
let headMesh, leftArm, rightArm, leftLeg, rightLeg;
let currentMode = 'walk';
let tickTimer = 0;

function init3DCharacterEngine() {
    const container = document.getElementById('threeJsCanvas');
    if (!container) return;
    const w = container.clientWidth || 400;
    const h = 240;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
    // Adjusted camera distance closer to ensure full high-impact visibility
    camera.position.set(0, 0.3, 4.2);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Dynamic Cinematic Studio Space Lighting Map
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dLight.position.set(5, 10, 5);
    scene.add(dLight);
    const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.6);
    rimLight.position.set(-5, 4, -4);
    scene.add(rimLight);

    characterGroup = new THREE.Group();
    characterGroup.position.y = -0.9;
    scene.add(characterGroup);

    // Premium Solid Poly Shaders
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.4 });
    const hairMat = new THREE.MeshStandardMaterial({ color: 0x1a110e, roughness: 0.6 });
    const shirtMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
    const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.5 });
    const tieMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });
    const shoeMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });

    // 🧑 HEAD MESH COMPONENT
    const headGeo = new THREE.SphereGeometry(0.38, 32, 32);
    headGeo.scale(1, 1.06, 0.95);
    headMesh = new THREE.Mesh(headGeo, skinMat);
    headMesh.position.y = 1.4;
    characterGroup.add(headMesh);

    // Deep Eyes
    const eyeGeo = new THREE.SphereGeometry(0.05, 16, 16);
    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
    leftEye.position.set(-0.12, 0.05, 0.32);
    headMesh.add(leftEye);
    const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
    rightEye.position.set(0.12, 0.05, 0.32);
    headMesh.add(rightEye);

    // Styled Hair Mesh Cap
    const hairGeo = new THREE.SphereGeometry(0.4, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
    const hairTop = new THREE.Mesh(hairGeo, hairMat);
    hairTop.position.y = 0.04;
    headMesh.add(hairTop);

    // 👔 TORSO MESH (Tucked White Dress Shirt + Red Tie)
    const torsoGeo = new THREE.CylinderGeometry(0.28, 0.24, 0.75, 32);
    const torsoMesh = new THREE.Mesh(torsoGeo, shirtMat);
    torsoMesh.position.y = 0.75;
    characterGroup.add(torsoMesh);

    const tieGeo = new THREE.BoxGeometry(0.06, 0.35, 0.03);
    const tieMesh = new THREE.Mesh(tieGeo, tieMat);
    tieMesh.position.set(0, 0.12, 0.28);
    tieMesh.rotation.x = 0.06;
    torsoMesh.add(tieMesh);

    // 👖 TROUSERS MESH (Royal Blue Pants Shape Layer)
    const pantsGeo = new THREE.CylinderGeometry(0.24, 0.24, 0.25, 32);
    const pantsMesh = new THREE.Mesh(pantsGeo, pantsMat);
    pantsMesh.position.y = 0.28;
    characterGroup.add(pantsMesh);
    // 🦵 LIMBS SYSTEM
    const limbGeo = new THREE.CylinderGeometry(0.08, 0.06, 0.5, 16);
    
    // Left Leg Node
    leftLeg = new THREE.Group();
    leftLeg.position.set(-0.12, 0.18, 0);
    characterGroup.add(leftLeg);
    const leftLegMesh = new THREE.Mesh(limbGeo, pantsMat);
    leftLegMesh.position.y = -0.25;
    leftLeg.add(leftLegMesh);
    const leftFoot = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.18), shoeMat);
    leftFoot.position.set(0, -0.5, 0.04);
    leftLeg.add(leftFoot);

    // Right Leg Node
    rightLeg = new THREE.Group();
    rightLeg.position.set(0.12, 0.18, 0);
    characterGroup.add(rightLeg);
    const rightLegMesh = new THREE.Mesh(limbGeo, pantsMat);
    rightLegMesh.position.y = -0.25;
    rightLeg.add(rightLegMesh);
    const rightFoot = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.18), shoeMat);
    rightFoot.position.set(0, -0.5, 0.04);
    rightLeg.add(rightFoot);

    // Left Arm Node
    leftArm = new THREE.Group();
    leftArm.position.set(-0.36, 1.05, 0);
    characterGroup.add(leftArm);
    const leftArmMesh = new THREE.Mesh(limbGeo, shirtMat);
    leftArmMesh.position.y = -0.25;
    leftArm.add(leftArmMesh);
    const leftHand = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), skinMat);
    leftHand.position.y = -0.5;
    leftArm.add(leftHand);

    // Right Arm Node
    rightArm = new THREE.Group();
    rightArm.position.set(0.36, 1.05, 0);
    characterGroup.add(rightArm);
    const rightArmMesh = new THREE.Mesh(limbGeo, shirtMat);
    rightArmMesh.position.y = -0.25;
    rightArm.add(rightArmMesh);
    const rightHand = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), skinMat);
    rightHand.position.y = -0.5;
    rightArm.add(rightHand);

    animateEngineLoop();
}

function triggerBoyExpression(poseName) {
    currentMode = poseName;
}
function trigger3DExpression(p) { triggerBoyExpression(p); }

function animateEngineLoop() {
    requestAnimationFrame(animateEngineLoop);
    tickTimer += 0.05;

    // Fluid breathing baseline
    if(headMesh) {
        headMesh.rotation.y = Math.sin(tickTimer * 0.4) * 0.04;
        headMesh.position.y = 1.4 + Math.sin(tickTimer * 0.8) * 0.01;
    }

    let lerpSpeed = 0.15;

    if (currentMode === 'walk' && leftLeg && rightLeg && leftArm && rightArm) {
        leftLeg.rotation.x = Math.sin(tickTimer * 1.6) * 0.45;
        rightLeg.rotation.x = -Math.sin(tickTimer * 1.6) * 0.45;
        leftArm.rotation.x = -Math.sin(tickTimer * 1.6) * 0.35;
        rightArm.rotation.x = Math.sin(tickTimer * 1.6) * 0.35;
        leftArm.rotation.z = THREE.MathUtils.lerp(leftArm.rotation.z, -0.05, lerpSpeed);
        rightArm.rotation.z = THREE.MathUtils.lerp(rightArm.rotation.z, 0.05, lerpSpeed);
        headMesh.rotation.x = THREE.MathUtils.lerp(headMesh.rotation.x, 0, lerpSpeed);
        characterGroup.position.y = -0.9 + Math.abs(Math.sin(tickTimer * 1.6)) * 0.03;
    } 
    else if (currentMode === 'look-down' && headMesh && leftArm && rightArm) {
        headMesh.rotation.x = THREE.MathUtils.lerp(headMesh.rotation.x, 0.24, lerpSpeed);
        leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0.05, lerpSpeed);
        rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0.05, lerpSpeed);
    } 
    else if (currentMode === 'thinking' && headMesh && leftArm && rightArm) {
        headMesh.rotation.x = THREE.MathUtils.lerp(headMesh.rotation.x, -0.05, lerpSpeed);
        headMesh.rotation.y = THREE.MathUtils.lerp(headMesh.rotation.y, -0.2, lerpSpeed);
        leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, -0.2, lerpSpeed);
        rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, -1.5, lerpSpeed);
    } 
    else if (currentMode === 'thumbs-up' && headMesh && leftArm && rightArm) {
        leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0.1, lerpSpeed);
        rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, -1.9, lerpSpeed);
        rightArm.rotation.z = THREE.MathUtils.lerp(rightArm.rotation.z, -0.3, lerpSpeed);
    }

    if (renderer && scene && camera) {
        renderer.render(scene, camera);
    }
}

window.addEventListener('resize', () => {
    const container = document.getElementById('threeJsCanvas');
    if (!container || !camera || !renderer) return;
    const w = container.clientWidth;
    camera.aspect = w / 240;
    camera.updateProjectionMatrix();
    renderer.setSize(w, 240);
});

window.addEventListener('load', init3DCharacterEngine);
</script>
</body>
</html>
