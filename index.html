<!DOCTYPE html>
<html lang="en">
<head>
<title>DevOps Test Platform</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(-45deg, #090d16, #110e25, #1d093b, #090d16);
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
    margin: 0;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 95vh;
    overflow: hidden;
    color: #f8fafc;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    padding: 30px;
    max-width: 480px;
    width: 100%;
    margin: auto;
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.7);
    text-align: center;
    position: relative;
    z-index: 10;
}

h2 {
    font-size: 32px;
    margin: 0 0 20px 0;
    background: linear-gradient(to right, #38bdf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
    letter-spacing: -0.5px;
}

h3 {
    color: #94a3b8;
    font-size: 19px;
    margin-bottom: 25px;
    font-weight: 500;
}

input {
    padding: 14px 18px;
    width: 82%;
    max-width: 320px;
    border-radius: 14px;
    border: 2px solid rgba(255, 255, 255, 0.06);
    background: rgba(5, 8, 16, 0.7);
    color: #fff;
    font-size: 16px;
    margin: 10px 0;
    outline: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
input::placeholder { color: #475569; }
input:focus {
    border-color: #38bdf8;
    background: rgba(5, 8, 16, 0.9);
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
}

button {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: white;
    border: none;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
    margin: 8px;
    box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
button:hover {
    background: linear-gradient(135deg, #60a5fa, #2563eb);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(59, 130, 246, 0.35);
}

.hidden { display: none !important; }
.section { margin-top: 5px; }

/* 🌟 DYNAMIC TASKBAR-LEVEL 3D CHARACTER SPACE */
.canvas-3d-viewport {
    width: 100%;
    height: 180px;
    margin-top: 25px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    overflow: hidden;
    background: radial-gradient(circle at center, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
    border-radius: 16px;
}

.char-box {
    width: 100px;
    height: 160px;
    position: relative;
    perspective: 800px;
}

.boy-3d {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: all 0.4s ease-in-out;
}

/* Handsome Skeletal Layers */
.b-head {
    width: 46px; height: 48px;
    background: #fcd34d;
    border-radius: 50% 50% 45% 45%;
    position: absolute; top: 10px; left: 27px;
    box-shadow: inset -3px -3px 8px #d97706, 0 4px 8px rgba(0,0,0,0.3);
    z-index: 5;
    transition: transform 0.3s ease;
}
.b-hair {
    width: 50px; height: 26px;
    background: #271c19;
    border-radius: 40% 40% 10% 10%;
    position: absolute; top: -4px; left: -2px;
}
.b-hair::after {
    content: ''; position: absolute;
    width: 16px; height: 14px; background: #271c19;
    top: 18px; left: 4px; border-radius: 0 0 4px 0;
    transform: rotate(-15deg);
}
.b-eye {
    width: 8px; height: 10px; background: #0f172a;
    border-radius: 50%; position: absolute; top: 20px;
}
.b-eye.l { left: 10px; }
.b-eye.r { right: 10px; }
.b-eye::after {
    content: ''; position: absolute; width: 3px; height: 3px;
    background: #fff; border-radius: 50%; top: 1px; left: 1px;
}
.b-mouth {
    width: 12px; height: 6px; border-bottom: 3px solid #9a3412;
    border-radius: 0 0 50% 50%; position: absolute; bottom: 8px; left: 17px;
}

/* White Shirt & Tie Layer */
.b-torso {
    width: 40px; height: 50px;
    background: #ffffff;
    border-radius: 10px 10px 4px 4px;
    position: absolute; top: 58px; left: 30px; z-index: 4;
    box-shadow: inset -3px -2px 6px rgba(0,0,0,0.1), 0 4px 10px rgba(0,0,0,0.2);
}
.b-collar {
    position: absolute; top: 0; width: 10px; height: 6px;
    border-top: 6px solid #cbd5e1; border-right: 8px solid transparent;
}
.b-collar.l { left: 6px; transform: rotate(-15deg); }
.b-collar.r { right: 6px; border-left: 8px solid transparent; border-right: none; transform: rotate(15deg); }
.b-tie {
    width: 6px; height: 24px; background: #2563eb;
    position: absolute; top: 6px; left: 17px; border-radius: 1px 1px 3px 3px;
}

/* Blue Pants & Limbs Layer */
.b-pants {
    width: 40px; height: 40px; background: #1e3a8a;
    border-radius: 2px 2px 6px 6px;
    position: absolute; top: 106px; left: 30px; z-index: 3;
}
.b-leg {
    width: 13px; height: 22px; background: #1e3a8a;
    position: absolute; bottom: -14px; transform-origin: top center;
}
.b-leg.l { left: 3px; }
.b-leg.r { right: 3px; }
.b-shoe {
    width: 16px; height: 9px; background: #334155;
    position: absolute; bottom: -7px; left: -1px; border-radius: 5px 5px 2px 2px;
}
.b-arm {
    width: 11px; height: 38px; background: #ffffff;
    position: absolute; top: 2px; transform-origin: top center;
    border-radius: 5px;
}
.b-arm.l { left: -9px; transform: rotate(12deg); }
.b-arm.r { right: -9px; transform: rotate(-12deg); }
.b-hand {
    width: 11px; height: 11px; background: #fcd34d;
    position: absolute; bottom: -3px; left: 0; border-radius: 50%;
}

/* Countdown Visual Layers */
#countdownOverlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(5, 8, 16, 0.98);
    backdrop-filter: blur(30px); z-index: 99999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
}
#countdownOverlay.active { opacity: 1; pointer-events: auto; }
.countdown-number {
    font-size: 140px; font-weight: 900; color: #38bdf8;
    text-shadow: 0 0 50px rgba(56, 189, 248, 0.4); animation: scalePulse 1s ease-in-out infinite;
}
@keyframes scalePulse { 0% { transform: scale(0.5); opacity: 0; } 30% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
.wish-text {
    font-size: 48px; font-weight: 900; background: linear-gradient(to right, #fbbf24, #f87171, #ec4899);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-top: 20px;
    letter-spacing: 1px; animation: textPop 0.5s ease forwards;
}
@keyframes textPop { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
 <!-- =============================================================
     🎬 DYNAMIC PURE CSS HANDSOME SKELETAL RIGGING STYLES
     ============================================================= -->
<style>
/* --- STATE A: WALKING LOGIC --- */
.boy-3d.walk .b-leg.l { animation: cssWalk 0.6s infinite alternate ease-in-out; }
.boy-3d.walk .b-leg.r { animation: cssWalk 0.6s infinite alternate-reverse ease-in-out; }
.boy-3d.walk .b-arm.l { animation: cssArm 0.6s infinite alternate-reverse ease-in-out; }
.boy-3d.walk .b-arm.r { animation: cssArm 0.6s infinite alternate ease-in-out; }
.boy-3d.walk { animation: cssBob 0.3s infinite alternate ease-in-out; }

@keyframes cssWalk { 0% { transform: rotate(24deg); } 100% { transform: rotate(-24deg); } }
@keyframes cssArm { 0% { transform: rotate(18deg); } 100% { transform: rotate(-18deg); } }
@keyframes cssBob { 0% { transform: translateY(0); } 100% { transform: translateY(-3px); } }

/* --- STATE B: LOOK DOWN (WHEN FIELDS TYPED) --- */
.boy-3d.look-down .b-head { transform: translateY(3px) rotateX(15deg); }
.boy-3d.look-down .b-eye { transform: translateY(2px); }

/* --- STATE C: HANDSOME THINKING EXPRESSION --- */
.boy-3d.thinking { animation: cssFloat 3s infinite ease-in-out; }
.boy-3d.thinking .b-head { transform: rotateY(-10deg) rotateZ(-2deg); }
.boy-3d.thinking .b-eye { transform: translate(-1px, -1px); }
.boy-3d.thinking .b-arm.l { transform: rotate(-25deg); }
.boy-3d.thinking .b-arm.r { transform: rotate(-120deg) translateX(-4px); }
@keyframes cssFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

/* --- STATE D: WINNING THUMBS-UP STANCE --- */
.boy-3d.thumbs-up .b-arm.r { transform: rotate(-140deg); }
.boy-3d.thumbs-up .b-eye { transform: scaleY(0.3) translateY(1px); }
.boy-3d.thumbs-up .b-mouth { width: 14px; height: 8px; border-bottom-width: 4px; }
</style>

<body>

<div class="container">
    <h2>DevOps Test Platform</h2>

    <!-- STEP 1: USER INPUT -->
    <div id="userForm" class="section">
        <input type="text" id="name" placeholder="Enter Name" onfocus="triggerBoyExpression('look-down')" onblur="triggerBoyExpression('walk')">
        <input type="text" id="surname" placeholder="Enter Surname" onfocus="triggerBoyExpression('look-down')" onblur="triggerBoyExpression('walk')">
        <br>
        <button onclick="goToSelection()">Next</button>
    </div>

    <!-- STEP 2: TEST SELECTION -->
    <div id="testSelection" class="section hidden">
        <h3>Select Test</h3>
        <button onclick="selectTest('aws')">AWS Test</button>
        <button onclick="selectTest('linux')">Linux Test</button>
        <button onclick="selectTest('devops')">DevOps Test</button>
    </div>

    <!-- STEP 3: DEVOPS OPTIONS -->
    <div id="devopsOptions" class="section hidden">
        <h3>Select DevOps Tool</h3>
        <button onclick="selectDevops('git')">Git</button>
        <button onclick="selectDevops('docker')">Docker</button>
        <button onclick="selectDevops('kubernetes')">Kubernetes</button>
        <button onclick="selectDevops('terraform')">Terraform</button>
        <button onclick="selectDevops('jenkins')">Jenkins</button>
        <button onclick="selectDevops('all')">All DevOps</button>
    </div>

    <!-- STEP 4: START -->
    <div id="startSection" class="section hidden">
        <h3 id="selectedTestText"></h3>
        <button onclick="startTest()">Start Test</button>
    </div>

    <!-- 🌟 HIGH-SCHOOLER 3D RIG VIEWPORT CONTAINER -->
    <div class="canvas-3d-viewport">
        <div class="char-box">
            <div class="boy-3d walk" id="boyRigNode">
                <div class="b-head">
                    <div class="b-hair"></div>
                    <div class="b-eye l"></div>
                    <div class="b-eye r"></div>
                    <div class="b-mouth"></div>
                </div>
                <div class="b-torso">
                    <div class="b-collar l"></div>
                    <div class="b-collar r"></div>
                    <div class="b-tie"></div>
                    <div class="b-arm l"><div class="b-hand"></div></div>
                    <div class="b-arm r"><div class="b-hand"></div></div>
                </div>
                <div class="b-pants">
                    <div class="b-leg l"><div class="b-shoe"></div></div>
                    <div class="b-leg r"><div class="b-shoe"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- FULLSCREEN TIMER OVERLAY LAYER -->
<div id="countdownOverlay">
    <div class="canvas-3d-viewport" id="overlayViewport" style="height:200px; width:200px; margin-bottom:15px; background:none;"></div>
    <div id="countdownDisplay" class="countdown-number">3</div>
    <div id="wishTextDisplay" class="wish-text hidden">ALL THE BEST! 🚀</div>
</div>

<script>
// Programmatic helper to swap high-schooler poses seamlessly across DOM transitions
function triggerBoyExpression(poseName) {
    const rig = document.getElementById("boyRigNode");
    if (!rig) return;
    rig.className = "boy-3d " + poseName;
}
</script>
<script src="script.js"></script>
</body>
</html>
