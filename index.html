<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b18">
    <title>DevOps Test Platform</title>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            overflow-x: hidden;
            color: #f8fafc;
            font-family: "Segoe UI", system-ui, sans-serif;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(56, 189, 248, 0.13), transparent 38%),
                radial-gradient(ellipse at 85% 80%, rgba(167, 139, 250, 0.14), transparent 40%),
                linear-gradient(140deg, #05070f, #0a081a 55%, #140526);
            background-size: 150% 150%;
            animation: backgroundDrift 18s ease-in-out infinite alternate;
        }

        @keyframes backgroundDrift {
            to {
                background-position: 100% 100%;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(100%, 520px);
            padding: clamp(24px, 5vw, 38px);
            overflow: hidden;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            background: rgba(15, 18, 34, 0.78);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(22px);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #7dd3fc;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #f8fafc;
            font-size: clamp(28px, 7vw, 38px);
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .subtitle {
            max-width: 370px;
            margin: 12px auto 26px;
            color: #aab5ca;
            line-height: 1.6;
        }

        .section {
            margin-top: 8px;
            animation: sectionIn 350ms ease both;
        }

        @keyframes sectionIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section h2 {
            margin: 0 0 18px;
            color: #e2e8f0;
            font-size: 20px;
        }

        .form-fields {
            display: grid;
            gap: 12px;
            width: min(100%, 370px);
            margin: 0 auto 16px;
        }

        input {
            width: 100%;
            min-height: 52px;
            padding: 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            outline: none;
            color: #f8fafc;
            background: rgba(3, 6, 16, 0.7);
            font: inherit;
            transition: border-color 180ms ease, box-shadow 180ms ease;
        }

        input::placeholder {
            color: #7c879c;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.14);
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 11px;
            width: min(100%, 390px);
            margin: 0 auto;
        }

        button {
            min-height: 50px;
            padding: 12px 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #f8fafc;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.2);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.12);
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:focus-visible {
            outline: 3px solid #7dd3fc;
            outline-offset: 3px;
        }

        .primary-button {
            min-width: 170px;
            margin-top: 4px;
        }

        .tool-grid button:last-child {
            grid-column: 1 / -1;
        }

        .selected-test {
            color: #c4b5fd;
            line-height: 1.5;
        }

        .canvas-3d-viewport {
            position: relative;
            width: 100%;
            height: 245px;
            margin: 26px auto -18px;
            overflow: hidden;
            border-radius: 22px;
            background:
                radial-gradient(ellipse at 50% 100%, rgba(56, 189, 248, 0.16), transparent 64%),
                linear-gradient(180deg, transparent, rgba(3, 6, 16, 0.38));
        }

        #threeJsCanvas {
            width: 100%;
            height: 100%;
        }

        #threeJsCanvas canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .boy-message {
            position: absolute;
            z-index: 2;
            top: 8px;
            left: 50%;
            max-width: calc(100% - 32px);
            padding: 9px 15px;
            transform: translateX(-50%);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 18px;
            color: #172554;
            background: #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .boy-message::after {
            position: absolute;
            bottom: -7px;
            left: 50%;
            width: 12px;
            height: 12px;
            transform: translateX(-50%) rotate(45deg);
            border-right: 1px solid rgba(15, 23, 42, 0.08);
            border-bottom: 1px solid rgba(15, 23, 42, 0.08);
            background: #fff;
            content: "";
        }

        .boy-message.hidden {
            opacity: 0;
            transform: translate(-50%, 8px);
        }

        .hidden {
            display: none !important;
        }

        #countdownOverlay {
            position: fixed;
            z-index: 10;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(4, 6, 12, 0.96);
            opacity: 0;
            pointer-events: none;
            transition: opacity 300ms ease;
            backdrop-filter: blur(18px);
        }

        #countdownOverlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .countdown-number {
            color: #38bdf8;
            font-size: clamp(100px, 22vw, 150px);
            font-weight: 900;
            text-shadow: 0 0 45px rgba(56, 189, 248, 0.45);
        }

        .wish-text {
            margin-top: 16px;
            color: #fbbf24;
            font-size: clamp(30px, 8vw, 52px);
            font-weight: 900;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            .container {
                padding: 24px 18px;
                border-radius: 24px;
            }

            .canvas-3d-viewport {
                height: 220px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <p class="eyebrow">Learn • Practice • Grow</p>
        <h1>DevOps Test Platform</h1>
        <p class="subtitle">Choose a topic, test your knowledge, and see how far you’ve come.</p>

        <section id="userForm" class="section" aria-label="Enter your name">
            <div class="form-fields">
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your first name"
                    autocomplete="given-name"
                    aria-label="First name"
                    onfocus="triggerBoyExpression('look-down')"
                    onblur="triggerBoyExpression('walk')">

                <input
                    type="text"
                    id="surname"
                    name="surname"
                    placeholder="Enter your surname"
                    autocomplete="family-name"
                    aria-label="Surname"
                    onfocus="triggerBoyExpression('look-down')"
                    onblur="triggerBoyExpression('walk')">
            </div>

            <button class="primary-button" type="button" onclick="goToSelection()">Next</button>
        </section>

        <section id="testSelection" class="section hidden" aria-label="Select a test">
            <h2>Select a test</h2>
            <div class="button-grid">
                <button type="button" onclick="selectTest('aws')">AWS</button>
                <button type="button" onclick="selectTest('linux')">Linux</button>
                <button type="button" onclick="selectTest('devops')">DevOps</button>
            </div>
        </section>

        <section id="devopsOptions" class="section hidden" aria-label="Select a DevOps tool">
            <h2>Select a DevOps tool</h2>
            <div class="button-grid tool-grid">
                <button type="button" onclick="selectDevops('git')">Git</button>
                <button type="button" onclick="selectDevops('docker')">Docker</button>
                <button type="button" onclick="selectDevops('kubernetes')">Kubernetes</button>
                <button type="button" onclick="selectDevops('terraform')">Terraform</button>
                <button type="button" onclick="selectDevops('jenkins')">Jenkins</button>
                <button type="button" onclick="selectDevops('all')">All DevOps</button>
            </div>
        </section>

        <section id="startSection" class="section hidden" aria-label="Start the test">
            <h2 id="selectedTestText" class="selected-test"></h2>
            <button class="primary-button" type="button" onclick="startTest()">Start test</button>
        </section>

        <div class="canvas-3d-viewport" aria-label="Animated student character">
            <div id="boyMessage" class="boy-message" role="status" aria-live="polite">Hii! 👋</div>
            <div id="threeJsCanvas"></div>
        </div>
    </main>

    <div id="countdownOverlay" aria-live="assertive">
        <div id="countdownDisplay" class="countdown-number">3</div>
        <div id="wishTextDisplay" class="wish-text hidden">ALL THE BEST! 🚀</div>
    </div>

    <script src="script.js"></script>
    <script type="module" src="character.js"></script>
</body>
</html>
