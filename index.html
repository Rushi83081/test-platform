<!DOCTYPE html>
<html lang="en">
<head>
<title>DevOps Test Platform</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(-45deg, #0f172a, #1e1b4b, #2e1065, #0f172a);
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
    margin: 0;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 95vh;
    overflow-x: hidden;
    color: #f8fafc;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 30px;
    max-width: 550px;
    width: 100%;
    margin: auto;
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    text-align: center;
    position: relative;
    z-index: 10;
}

/* --- CHARACTER GRAPHIC CANVAS --- */
.avatar-box {
    width: 150px;
    height: 150px;
    margin: 0 auto 15px auto;
    position: relative;
}

.boy-avatar {
    width: 100%;
    height: 100%;
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* State: Thinking Animation */
.boy-avatar.thinking {
    animation: floatThink 2.5s ease-in-out infinite;
}
@keyframes floatThink {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(2deg); }
}

/* SVG Internal Target Transitions */
.eye-pupil {
    transition: transform 0.3s ease;
}
.boy-arm, .boy-thumb {
    display: none;
    transform-origin: 30px 110px;
}
.thinking-hand {
    display: none;
    transform-origin: 75px 120px;
}

/* Toggling parts via parent state classes */
.boy-avatar.look-down .eye-pupil {
    transform: translateY(4px) scaleY(0.9);
}
.boy-avatar.thinking .thinking-hand {
    display: block;
    animation: handNudge 2.5s ease-in-out infinite;
}
@keyframes handNudge {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
}
.boy-avatar.thumbs-up .boy-arm, 
.boy-avatar.thumbs-up .boy-thumb {
    display: block;
    animation: popThumb 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
@keyframes popThumb {
    0% { transform: scale(0) rotate(-20deg); }
    100% { transform: scale(1) rotate(0deg); }
}

h2 {
    font-size: 28px;
    margin: 0 0 25px 0;
    background: linear-gradient(to right, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
}

h3 {
    color: #cbd5e1;
    font-size: 20px;
    margin-bottom: 20px;
    font-weight: 500;
}

/* --- FORM & DESIGN FIELDS --- */
input {
    padding: 14px 16px;
    width: 80%;
    max-width: 300px;
    border-radius: 12px;
    border: 2px solid rgba(255, 255, 255, 0.1);
    background: rgba(15, 23, 42, 0.4);
    color: #fff;
    font-size: 16px;
    margin: 8px 0;
    outline: none;
    transition: all 0.3s ease;
}
input::placeholder { color: #64748b; }
input:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
}

button {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 12px;
    cursor: pointer;
    margin: 8px;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
button:hover {
    background: linear-gradient(135deg, #60a5fa, #2563eb);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
}
button:active { transform: translateY(0); }

.hidden { display: none !important; }
.section { margin-top: 10px; }

/* --- FULLSCREEN COUNTDOWN SCREEN --- */
#countdownOverlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(20px);
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
}
#countdownOverlay.active { opacity: 1; pointer-events: auto; }

.countdown-number {
    font-size: 120px;
    font-weight: 800;
    color: #38bdf8;
    text-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
    animation: scalePulse 1s ease-in-out infinite;
}
@keyframes scalePulse {
    0% { transform: scale(0.6); opacity: 0; }
    30% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
}

.wish-text {
    font-size: 42px;
    font-weight: 800;
    background: linear-gradient(to right, #f59e0b, #ef4444, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-top: 20px;
    letter-spacing: 1px;
    animation: textPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
@keyframes textPop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>

<div class="container">
    
    <!-- THE RESPONSIVE BOY AVATAR SYSTEM -->
    <div class="avatar-box">
        <svg class="boy-avatar" id="avatarSvg" viewBox="0 0 150 150">
            <!-- Hair Background -->
            <path d="M40,50 Q75,15 110,50 Q115,35 100,25 Q75,10 50,25 Q35,35 40,50" fill="#2d1d13"/>
            <!-- Face -->
            <circle cx="75" cy="65" r="35" fill="#fcd34d"/>
            <!-- Hair Front Fringe -->
            <path d="M41,45 Q60,35 75,48 Q90,35 109,45 Q95,25 75,30 Q55,25 41,45" fill="#3d2a1d"/>
            <!-- Eyes Base (White) -->
            <circle cx="62" cy="60" r="6" fill="#fff"/>
            <circle cx="88" cy="60" r="6" fill="#fff"/>
            <!-- Pupils (Moving Elements) -->
            <circle class="eye-pupil" id="pupilL" cx="62" cy="60" r="3" fill="#0f172a"/>
            <circle class="eye-pupil" id="pupilR" cx="88" cy="60" r="3" fill="#0f172a"/>
            <!-- Happy Mouth -->
            <path d="M65,78 Q75,86 85,78" fill="none" stroke="#9a3412" stroke-width="3" stroke-linecap="round"/>
            <!-- Thinking Hand Arm Pose Component -->
            <path class="thinking-hand" d="M60,95 Q52,78 68,75" fill="none" stroke="#fcd34d" stroke-width="7" stroke-linecap="round"/>
            <!-- Thumbs up Arm Component -->
            <path class="boy-arm" d="M110,85 Q130,85 125,70" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round"/>
            <path class="boy-thumb" d="M125,70 Q125,58 129,58 Q134,58 132,70" fill="none" stroke="#fcd34d" stroke-width="6" stroke-linecap="round"/>
        </svg>
    </div>

    <h2>DevOps Test Platform</h2>

    <!-- STEP 1: USER INPUT -->
    <div id="userForm" class="section">
        <input type="text" id="name" placeholder="Enter Name" onfocus="setAvatarState('look-down')" onblur="setAvatarState('')">
        <input type="text" id="surname" placeholder="Enter Surname" onfocus="setAvatarState('look-down')" onblur="setAvatarState('')">
        <br>
        <button onclick="goToSelection()">Next</button>
    </div>

    <!-- STEP 2: TEST SELECTION -->
    <div id="testSelection" class="section hidden">
        <h3>Select Test</h3>
        <button onclick="selectTest('aws')">AWS Test</button>
        <button onclick="selectTest('linux')">Linux Test</button>
        <button onclick="selectTest('devops')">DevOps Test</button>
    </div>

    <!-- STEP 3: DEVOPS OPTIONS -->
    <div id="devopsOptions" class="section hidden">
        <h3>Select DevOps Tool</h3>
        <button onclick="selectDevops('git')">Git</button>
        <button onclick="selectDevops('docker')">Docker</button>
        <button onclick="selectDevops('kubernetes')">Kubernetes</button>
        <button onclick="selectDevops('terraform')">Terraform</button>
        <button onclick="selectDevops('jenkins')">Jenkins</button>
        <button onclick="selectDevops('all')">All DevOps</button>
    </div>

    <!-- STEP 4: START -->
    <div id="startSection" class="section hidden">
        <h3 id="selectedTestText"></h3>
        <button onclick="startTest()">Start Test</button>
    </div>
</div>

<!-- CINEMATIC ANIMATED OVERLAY FOR COUNTDOWN -->
<div id="countdownOverlay">
    <div class="avatar-box" id="overlayAvatarBox" style="width:200px; height:200px;"></div>
    <div id="countdownDisplay" class="countdown-number">3</div>
    <div id="wishTextDisplay" class="wish-text hidden">ALL THE BEST! 🚀</div>
</div>

<script src="script.js"></script>
</body>
</html>
