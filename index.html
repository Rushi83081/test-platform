<!DOCTYPE html>
<html lang="en">
<head>
<title>DevOps Test Platform</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Load Google's High-Performance Immersive 3D/4D Core Scripts -->
<script type="module" src="https://googleapis.com"></script>
<style>
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(-45deg, #05070f, #0a081a, #140526, #05070f);
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
    margin: 0;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 95vh;
    overflow: hidden;
    color: #f8fafc;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    background: rgba(255, 255, 255, 0.02);
    backdrop-filter: blur(35px);
    -webkit-backdrop-filter: blur(35px);
    padding: 30px;
    max-width: 460px;
    width: 100%;
    margin: auto;
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 50px 100px -25px rgba(0, 0, 0, 0.85);
    text-align: center;
    position: relative;
    z-index: 10;
}

h2 {
    font-size: 32px;
    margin: 0 0 20px 0;
    background: linear-gradient(to right, #38bdf8, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
    letter-spacing: -0.5px;
}

h3 {
    color: #94a3b8;
    font-size: 19px;
    margin-bottom: 25px;
    font-weight: 500;
}

input {
    padding: 14px 18px;
    width: 82%;
    max-width: 320px;
    border-radius: 14px;
    border: 2px solid rgba(255, 255, 255, 0.06);
    background: rgba(4, 6, 12, 0.75);
    color: #fff;
    font-size: 16px;
    margin: 10px 0;
    outline: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
input::placeholder { color: #475569; }
input:focus {
    border-color: #38bdf8;
    background: rgba(4, 6, 12, 0.9);
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
}

button {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    border: none;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
    margin: 8px;
    box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
button:hover {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
}

.hidden { display: none !important; }
.section { margin-top: 5px; }

/* 🌟 DYNAMIC 3D VIEWPORT */
.canvas-3d-viewport {
    width: 100%;
    height: 240px;
    margin-top: 20px;
    position: relative;
    border-radius: 20px;
    overflow: hidden;
}

model-viewer {
    width: 100%;
    height: 100%;
    background-color: transparent;
    --poster-color: transparent;
}

#countdownOverlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(4, 6, 12, 0.99);
    backdrop-filter: blur(35px);
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
}
#countdownOverlay.active { opacity: 1; pointer-events: auto; }

.countdown-number {
    font-size: 140px;
    font-weight: 900;
    color: #38bdf8;
    text-shadow: 0 0 50px rgba(56, 189, 248, 0.4);
    animation: scalePulse 1s ease-in-out infinite;
}
@keyframes scalePulse {
    0% { transform: scale(0.5); opacity: 0; }
    30% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
}

.wish-text {
    font-size: 48px;
    font-weight: 900;
    background: linear-gradient(to right, #fbbf24, #f87171, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-top: 20px;
    letter-spacing: 1px;
    animation: textPop 0.5s ease forwards;
}
@keyframes textPop { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<div class="container">
    <h2>DevOps Test Platform</h2>

    <!-- STEP 1: USER INPUT -->
    <div id="userForm" class="section">
        <input type="text" id="name" placeholder="Enter Name" onfocus="triggerBoyExpression('look-down')" onblur="triggerBoyExpression('walk')">
        <input type="text" id="surname" placeholder="Enter Surname" onfocus="triggerBoyExpression('look-down')" onblur="triggerBoyExpression('walk')">
        <br>
        <button onclick="goToSelection()">Next</button>
    </div>

    <!-- STEP 2: TEST SELECTION -->
    <div id="testSelection" class="section hidden">
        <h3>Select Test</h3>
        <button onclick="selectTest('aws')">AWS Test</button>
        <button onclick="selectTest('linux')">Linux Test</button>
        <button onclick="selectTest('devops')">DevOps Test</button>
    </div>

    <!-- STEP 3: DEVOPS OPTIONS -->
    <div id="devopsOptions" class="section hidden">
        <h3>Select DevOps Tool</h3>
        <button onclick="selectDevops('git')">Git</button>
        <button onclick="selectDevops('docker')">Docker</button>
        <button onclick="selectDevops('kubernetes')">Kubernetes</button>
        <button onclick="selectDevops('terraform')">Terraform</button>
        <button onclick="selectDevops('jenkins')">Jenkins</button>
        <button onclick="selectDevops('all')">All DevOps</button>
    </div>

    <!-- STEP 4: START -->
    <div id="startSection" class="section hidden">
        <h3 id="selectedTestText"></h3>
        <button onclick="startTest()">Start Test</button>
    </div>

    <!-- 🌟 DYNAMIC 3D CHARACTER COMPONENT -->
    <div class="canvas-3d-viewport">
        <model-viewer 
            id="studentViewer"
            src="character.glb" 
            alt="3D Animated Schoolboy Model"
            autoplay
            camera-controls
            disable-zoom
            interaction-prompt="none"
            shadow-intensity="1.5"
            shadow-softness="1"
            camera-orbit="0deg 75deg 3.5m"
            field-of-view="30deg">
        </model-viewer>
    </div>
</div>

<div id="countdownOverlay">
    <div id="countdownDisplay" class="countdown-number">3</div>
    <div id="wishTextDisplay" class="wish-text hidden">ALL THE BEST! 🚀</div>
</div>

<script>
function triggerBoyExpression(animationName) {
    const viewerNode = document.getElementById("studentViewer");
    if (!viewerNode) return;

    if (animationName === 'look-down') {
        viewerNode.cameraOrbit = "0deg 85deg 3.2m";
    } else if (animationName === 'thinking') {
        viewerNode.cameraOrbit = "30deg 75deg 3.5m";
    } else if (animationName === 'thumbs-up') {
        viewerNode.cameraOrbit = "0deg 70deg 3.0m";
    } else {
        viewerNode.cameraOrbit = "0deg 75deg 3.5m";
    }

    if (viewerNode.availableAnimations.includes(animationName)) {
        viewerNode.animationName = animationName;
    }
}
function trigger3DExpression(p) { triggerBoyExpression(p); }
</script>
<script src="script.js"></script>
</body>
</html>
