<!DOCTYPE html>
<html lang="en">
<head>
<title>DevOps Test Platform</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(-45deg, #090d16, #110e25, #1d093b, #090d16);
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
    margin: 0;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 95vh;
    overflow: hidden;
    color: #f8fafc;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    padding: 30px;
    max-width: 480px;
    width: 100%;
    margin: auto;
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.7);
    text-align: center;
    position: relative;
    z-index: 10;
}
h2 {
    font-size: 32px;
    margin: 0 0 20px 0;
    background: linear-gradient(to right, #38bdf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
    letter-spacing: -0.5px;
}

h3 {
    color: #94a3b8;
    font-size: 19px;
    margin-bottom: 25px;
    font-weight: 500;
}

input {
    padding: 14px 18px;
    width: 82%;
    max-width: 320px;
    border-radius: 14px;
    border: 2px solid rgba(255, 255, 255, 0.06);
    background: rgba(5, 8, 16, 0.7);
    color: #fff;
    font-size: 16px;
    margin: 10px 0;
    outline: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
input::placeholder { color: #475569; }
input:focus {
    border-color: #38bdf8;
    background: rgba(5, 8, 16, 0.9);
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
}
button {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: white;
    border: none;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
    margin: 8px;
    box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
button:hover {
    background: linear-gradient(135deg, #60a5fa, #2563eb);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(59, 130, 246, 0.35);
}

.hidden { display: none !important; }
.section { margin-top: 5px; }

.student-avatar-space {
    width: 100%;
    height: 220px;
    margin-top: 25px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    overflow: hidden;
    background: radial-gradient(circle at center, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
    border-radius: 16px;
}

.student-character {
    width: 150px;
    height: 210px;
    position: relative;
    background-image: url('student.png');
    background-repeat: no-repeat;
    background-size: 600px auto;
    background-position: -20px -5px;
    transition: all 0.3s ease-in-out;
    transform-origin: bottom center;
}
.student-character.walk {
    animation: studentBreatheWalk 0.8s infinite alternate ease-in-out;
}
@keyframes studentBreatheWalk {
    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(-5px) scale(1.02); }
}

.student-character.look-down {
    transform: translateY(2px) scaleY(0.97);
}

.student-character.thinking {
    background-position: -170px -5px;
    animation: studentThink 2s infinite alternate ease-in-out;
}
@keyframes studentThink {
    0% { transform: rotate(-1deg); }
    100% { transform: rotate(1deg); }
}

.student-character.thumbs-up {
    background-position: -20px -5px;
    animation: studentWin 0.4s infinite alternate ease-in-out;
}
@keyframes studentWin {
    0% { transform: scale(1) translateY(0); }
    100% { transform: scale(1.08) translateY(-8px); }
}

#countdownOverlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(5, 8, 16, 0.98);
    backdrop-filter: blur(30px); z-index: 99999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
}
#countdownOverlay.active { opacity: 1; pointer-events: auto; }
.countdown-number {
    font-size: 140px; font-weight: 900; color: #38bdf8;
    text-shadow: 0 0 50px rgba(56, 189, 248, 0.4); animation: scalePulse 1s ease-in-out infinite;
}
@keyframes scalePulse { 0% { transform: scale(0.5); opacity: 0; } 30% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
.wish-text {
    font-size: 48px; font-weight: 900; background: linear-gradient(to right, #fbbf24, #f87171, #ec4899);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-top: 20px;
    letter-spacing: 1px; animation: textPop 0.5s ease forwards;
}
@keyframes textPop { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<div class="container">
    <h2>DevOps Test Platform</h2>

    <!-- STEP 1: USER INPUT -->
    <div id="userForm" class="section">
        <input type="text" id="name" placeholder="Enter Name" onfocus="triggerBoyExpression('look-down')" onblur="triggerBoyExpression('walk')">
        <input type="text" id="surname" placeholder="Enter Surname" onfocus="triggerBoyExpression('look-down')" onblur="triggerBoyExpression('walk')">
        <br>
        <button onclick="goToSelection()">Next</button>
    </div>

    <!-- STEP 2: TEST SELECTION -->
    <div id="testSelection" class="section hidden">
        <h3>Select Test</h3>
        <button onclick="selectTest('aws')">AWS Test</button>
        <button onclick="selectTest('linux')">Linux Test</button>
        <button onclick="selectTest('devops')">DevOps Test</button>
    </div>

    <!-- STEP 3: DEVOPS OPTIONS -->
    <div id="devopsOptions" class="section hidden">
        <h3>Select DevOps Tool</h3>
        <button onclick="selectDevops('git')">Git</button>
        <button onclick="selectDevops('docker')">Docker</button>
        <button onclick="selectDevops('kubernetes')">Kubernetes</button>
        <button onclick="selectDevops('terraform')">Terraform</button>
        <button onclick="selectDevops('jenkins')">Jenkins</button>
        <button onclick="selectDevops('all')">All DevOps</button>
    </div>
    <!-- STEP 4: START -->
    <div id="startSection" class="section hidden">
        <h3 id="selectedTestText"></h3>
        <button onclick="startTest()">Start Test</button>
    </div>

    <!-- 🌟 TASKBAR-LEVEL CONTAINER WINDOW FOR IMAGE RIG -->
    <div class="student-avatar-space">
        <div class="student-character walk" id="studentRigNode"></div>
    </div>
</div>

<!-- FULLSCREEN COUNTDOWN SYSTEM -->
<div id="countdownOverlay">
    <div class="student-avatar-space" id="overlayViewport" style="height:220px; width:220px; margin-bottom:15px; background:none;"></div>
    <div id="countdownDisplay" class="countdown-number">3</div>
    <div id="wishTextDisplay" class="wish-text hidden">ALL THE BEST! 🚀</div>
</div>

<script>
function triggerBoyExpression(poseName) {
    const node = document.getElementById("studentRigNode");
    if (node) {
        node.className = "student-character " + poseName;
    }
}
function trigger3DExpression(p) { triggerBoyExpression(p); }
</script>
<script src="script.js"></script>
</body>
</html>
