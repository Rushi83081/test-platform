<!DOCTYPE html>
<html lang="en">
<head>
<title>DevOps Test Platform</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cloudflare.com"></script>
<style>
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(-45deg, #090d16, #110e25, #1d093b, #090d16);
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
    margin: 0;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 95vh;
    overflow: hidden;
    color: #f8fafc;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    padding: 30px;
    max-width: 500px;
    width: 100%;
    margin: auto;
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.7);
    text-align: center;
    position: relative;
    z-index: 10;
}

h2 {
    font-size: 32px;
    margin: 0 0 20px 0;
    background: linear-gradient(to right, #38bdf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
    letter-spacing: -0.5px;
}

h3 {
    color: #94a3b8;
    font-size: 19px;
    margin-bottom: 25px;
    font-weight: 500;
}

input {
    padding: 14px 18px;
    width: 82%;
    max-width: 320px;
    border-radius: 14px;
    border: 2px solid rgba(255, 255, 255, 0.06);
    background: rgba(5, 8, 16, 0.7);
    color: #fff;
    font-size: 16px;
    margin: 10px 0;
    outline: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
input::placeholder { color: #475569; }
input:focus {
    border-color: #38bdf8;
    background: rgba(5, 8, 16, 0.9);
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
}

button {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: white;
    border: none;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
    margin: 8px;
    box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
button:hover {
    background: linear-gradient(135deg, #60a5fa, #2563eb);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(59, 130, 246, 0.35);
}

.hidden { display: none !important; }
.section { margin-top: 5px; }

.canvas-3d-viewport {
    width: 100%;
    height: 220px;
    margin-top: 20px;
    position: relative;
    border-radius: 16px;
    background: radial-gradient(circle at center, rgba(30,41,59,0.3) 0%, transparent 70%);
    overflow: hidden;
}

#threeJsCanvas {
    width: 100%;
    height: 100%;
    display: block;
}

#countdownOverlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(5, 8, 16, 0.98);
    backdrop-filter: blur(30px);
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
}
#countdownOverlay.active { opacity: 1; pointer-events: auto; }

.countdown-number {
    font-size: 140px;
    font-weight: 900;
    color: #38bdf8;
    text-shadow: 0 0 50px rgba(56, 189, 248, 0.4);
    animation: scalePulse 1s ease-in-out infinite;
}
@keyframes scalePulse {
    0% { transform: scale(0.5); opacity: 0; }
    30% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
}

.wish-text {
    font-size: 48px;
    font-weight: 900;
    background: linear-gradient(to right, #fbbf24, #f87171, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-top: 20px;
    letter-spacing: 1px;
    animation: textPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
@keyframes textPop { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<div class="container">
    <h2>DevOps Test Platform</h2>

    <!-- STEP 1: USER INPUT -->
    <div id="userForm" class="section">
        <input type="text" id="name" placeholder="Enter Name" onfocus="trigger3DExpression('look-down')" onblur="trigger3DExpression('walk')">
        <input type="text" id="surname" placeholder="Enter Surname" onfocus="trigger3DExpression('look-down')" onblur="trigger3DExpression('walk')">
        <br>
        <button onclick="goToSelection()">Next</button>
    </div>

    <!-- STEP 2: TEST SELECTION -->
    <div id="testSelection" class="section hidden">
        <h3>Select Test</h3>
        <button onclick="selectTest('aws')">AWS Test</button>
        <button onclick="selectTest('linux')">Linux Test</button>
        <button onclick="selectTest('devops')">DevOps Test</button>
    </div>

    <!-- STEP 3: DEVOPS OPTIONS -->
    <div id="devopsOptions" class="section hidden">
        <h3>Select DevOps Tool</h3>
        <button onclick="selectDevops('git')">Git</button>
        <button onclick="selectDevops('docker')">Docker</button>
        <button onclick="selectDevops('kubernetes')">Kubernetes</button>
        <button onclick="selectDevops('terraform')">Terraform</button>
        <button onclick="selectDevops('jenkins')">Jenkins</button>
        <button onclick="selectDevops('all')">All DevOps</button>
    </div>

    <!-- STEP 4: START -->
    <div id="startSection" class="section hidden">
        <h3 id="selectedTestText"></h3>
        <button onclick="startTest()">Start Test</button>
    </div>

    <!-- 🌟 TASKBAR LEVEL 3D RENDER CANVAS VIEWPORT -->
    <div class="canvas-3d-viewport">
        <div id="threeJsCanvas"></div>
    </div>
</div>

<!-- FULLSCREEN COUNTDOWN SYSTEM -->
<div id="countdownOverlay">
    <div class="canvas-3d-viewport" id="overlayCanvasViewport" style="height:250px; width:250px; margin-bottom:10px;"></div>
    <div id="countdownDisplay" class="countdown-number">3</div>
    <div id="wishTextDisplay" class="wish-text hidden">ALL THE BEST! 🚀</div>
</div>

<script src="script.js"></script>
<!-- =============================================================
     🎨 HIGH-FIDELITY AUTOMATED GL-ENGINE RIGGING CONTROLS
     ============================================================= -->
<script>
let scene, camera, renderer, characterGroup;
let headMesh, leftArm, rightArm, leftLeg, rightLeg;
let targetExpression = 'walk';
let globalAnimationTimer = 0;

function init3DCharacterEngine() {
    const containerElement = document.getElementById('threeJsCanvas');
    if (!containerElement) return;
    const displayWidth = containerElement.clientWidth || 440;
    const displayHeight = 220;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, displayWidth / displayHeight, 0.1, 1000);
    camera.position.set(0, 0, 7.5);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(displayWidth, displayHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    containerElement.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
    directionalLight.position.set(5, 10, 7);
    directionalLight.castShadow = true;
    scene.add(directionalLight);

    const rimLight = new THREE.DirectionalLight(0xa78bfa, 0.6);
    rimLight.position.set(-5, 2, -5);
    scene.add(rimLight);

    characterGroup = new THREE.Group();
    characterGroup.position.y = -1.6;
    scene.add(characterGroup);

    const skinMaterial = new THREE.MeshStandardMaterial({ color: 0xfcd34d, roughness: 0.35, metalness: 0.05 });
    const hairMaterial = new THREE.MeshStandardMaterial({ color: 0x271c19, roughness: 0.5 });
    const shirtMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
    const pantsMaterial = new THREE.MeshStandardMaterial({ color: 0x1e3a8a, roughness: 0.4 });
    const tieMaterial = new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.4 });
    const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x111827 });
    const shoeMaterial = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 });

    const headGeo = new THREE.SphereGeometry(0.7, 32, 32);
    headGeo.scale(1, 1.05, 0.95);
    headMesh = new THREE.Mesh(headGeo, skinMaterial);
    headMesh.position.y = 2.4;
    characterGroup.add(headMesh);

    const eyeGeo = new THREE.SphereGeometry(0.09, 16, 16);
    const leftEye = new THREE.Mesh(eyeGeo, eyeMaterial);
    leftEye.position.set(-0.25, 0.1, 0.6);
    headMesh.add(leftEye);

    const rightEye = new THREE.Mesh(eyeGeo, eyeMaterial);
    rightEye.position.set(0.25, 0.1, 0.6);
    headMesh.add(rightEye);

    const hairTopGeo = new THREE.SphereGeometry(0.74, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
    const hairTop = new THREE.Mesh(hairTopGeo, hairMaterial);
    hairTop.position.y = 0.1;
    headMesh.add(hairTop);

    const swooshGeo = new THREE.ConeGeometry(0.3, 0.6, 16);
    const hairSwoosh = new THREE.Mesh(swooshGeo, hairMaterial);
    hairSwoosh.position.set(0.1, 0.6, 0.4);
    hairSwoosh.rotation.set(0.3, 0, -0.6);
    headMesh.add(hairSwoosh);

    const torsoGeo = new THREE.CylinderGeometry(0.55, 0.45, 1.4, 32);
    const torsoMesh = new THREE.Mesh(torsoGeo, shirtMaterial);
    torsoMesh.position.y = 1.2;
    characterGroup.add(torsoMesh);

    const tieGeo = new THREE.BoxGeometry(0.12, 0.6, 0.05);
    const tieMesh = new THREE.Mesh(tieGeo, tieMaterial);
    tieMesh.position.set(0, 0.2, 0.52);
    tieMesh.rotation.x = 0.05;
    torsoMesh.add(tieMesh);

    const pantsGeo = new THREE.CylinderGeometry(0.46, 0.46, 0.5, 32);
    const pantsMesh = new THREE.Mesh(pantsGeo, pantsMaterial);
    pantsMesh.position.y = 0.35;
    characterGroup.add(pantsMesh);

    const limbGeo = new THREE.CylinderGeometry(0.15, 0.13, 0.9, 16);
    
    leftLeg = new THREE.Group();
    leftLeg.position.set(-0.25, 0.2, 0);
    characterGroup.add(leftLeg);
    const leftLegMesh = new THREE.Mesh(limbGeo, pantsMaterial);
    leftLegMesh.position.y = -0.45;
    leftLeg.add(leftLegMesh);
    const leftFoot = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.35), shoeMaterial);
    leftFoot.position.set(0, -0.9, 0.08);
    leftLeg.add(leftFoot);

    rightLeg = new THREE.Group();
    rightLeg.position.set(0.25, 0.2, 0);
    characterGroup.add(rightLeg);
    const rightLegMesh = new THREE.Mesh(limbGeo, pantsMaterial);
    rightLegMesh.position.y = -0.45;
    rightLeg.add(rightLegMesh);
    const rightFoot = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.35), shoeMaterial);
    rightFoot.position.set(0, -0.9, 0.08);
    rightLeg.add(rightFoot);

    leftArm = new THREE.Group();
    leftArm.position.set(-0.7, 1.7, 0);
    characterGroup.add(leftArm);
    const leftArmMesh = new THREE.Mesh(limbGeo, shirtMaterial);
    leftArmMesh.position.y = -0.45;
    leftArm.add(leftArmMesh);
    const leftHand = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 16), skinMaterial);
    leftHand.position.y = -0.9;
    leftArm.add(leftHand);

    rightArm = new THREE.Group();
    rightArm.position.set(0.7, 1.7, 0);
    characterGroup.add(rightArm);
    const rightArmMesh = new THREE.Mesh(limbGeo, shirtMaterial);
    rightArmMesh.position.y = -0.45;
    rightArm.add(rightArmMesh);
    const rightHand = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 16), skinMaterial);
    rightHand.position.y = -0.9;
    rightArm.add(rightHand);

    animate3DLoop();
}

function trigger3DExpression(poseType) {
    targetExpression = poseType;
}

function animate3DLoop() {
    requestAnimationFrame(animate3DLoop);
    globalAnimationTimer += 0.05;

    if(headMesh) {
        headMesh.rotation.y = Math.sin(globalAnimationTimer * 0.5) * 0.05;
        headMesh.position.y = 2.4 + Math.sin(globalAnimationTimer) * 0.02;
    }

    let lerpSpeed = 0.15;

    if (targetExpression === 'walk' && leftLeg && rightLeg && leftArm && rightArm && headMesh) {
        leftLeg.rotation.x = Math.sin(globalAnimationTimer * 1.5) * 0.4;
        rightLeg.rotation.x = -Math.sin(globalAnimationTimer * 1.5) * 0.4;
        leftArm.rotation.x = -Math.sin(globalAnimationTimer * 1.5) * 0.3;
        rightArm.rotation.x = Math.sin(globalAnimationTimer * 1.5) * 0.3;
        leftArm.rotation.z = THREE.MathUtils.lerp(leftArm.rotation.z, -0.1, lerpSpeed);
        rightArm.rotation.z = THREE.MathUtils.lerp(rightArm.rotation.z, 0.1, lerpSpeed);
        leftArm.rotation.y = THREE.MathUtils.lerp(leftArm.rotation.y, 0, lerpSpeed);
        rightArm.rotation.y = THREE.MathUtils.lerp(rightArm.rotation.y, 0, lerpSpeed);
        headMesh.rotation.x = THREE.MathUtils.lerp(headMesh.rotation.x, 0, lerpSpeed);
        characterGroup.position.y = -1.6 + Math.abs(Math.sin(globalAnimationTimer * 1.5)) * 0.05;
    } 
    else if (targetExpression === 'look-down' && headMesh && leftArm && rightArm && leftLeg && rightLeg) {
        headMesh.rotation.x = THREE.MathUtils.lerp(headMesh.rotation.x, 0.3, lerpSpeed);
        leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0.1, lerpSpeed);
        rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0.1, lerpSpeed);
        leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0, lerpSpeed);
        rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, lerpSpeed);
    } 
    else if (targetExpression === 'thinking' && headMesh && leftArm && rightArm && leftLeg && rightLeg) {
        headMesh.rotation.x = THREE.MathUtils.lerp(headMesh.rotation.x, -0.1, lerpSpeed);
        headMesh.rotation.y = THREE.MathUtils.lerp(headMesh.rotation.y, -0.2, lerpSpeed);
        leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, -0.4, lerpSpeed);
        leftArm.rotation.z = THREE.MathUtils.lerp(leftArm.rotation.z, 0.3, lerpSpeed);
        rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, -1.8, lerpSpeed);
        rightArm.rotation.y = THREE.MathUtils.lerp(rightArm.rotation.y, -0.6, lerpSpeed);
        leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0.1, lerpSpeed);
        rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, -0.1, lerpSpeed);
    } 
    else if (targetExpression === 'thumbs-up' && headMesh && leftArm && rightArm && leftLeg && rightLeg) {
        headMesh.rotation.x = THREE.MathUtils.lerp(headMesh.rotation.x, -0.05, lerpSpeed);
        headMesh.rotation.y = THREE.MathUtils.lerp(headMesh.rotation.y, 0, lerpSpeed);
        leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0.2, lerpSpeed);
        leftArm.rotation.z = THREE.MathUtils.lerp(leftArm.rotation.z, -0.2, lerpSpeed);
        rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, -2.1, lerpSpeed);
        rightArm.rotation.z = THREE.MathUtils.lerp(rightArm.rotation.z, -0.4, lerpSpeed);
        leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0, lerpSpeed);
        rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, lerpSpeed);
    }

    if(renderer && scene && camera) {
        renderer.render(scene, camera);
    }
}

window.addEventListener('resize', () => {
    const canvasContainer = document.getElementById('threeJsCanvas');
    if (!canvasContainer || !camera || !renderer) return;
    const w = canvasContainer.clientWidth;
    camera.aspect = w / 220;
    camera.updateProjectionMatrix();
    renderer.setSize(w, 220);
});

window.addEventListener('load', init3DCharacterEngine);
</script>
</body>
</html>
