<!DOCTYPE html>
<html>
<head>
<title>Test Platform</title>
<meta charset="UTF-8">

<style>

body {
font-family: 'Segoe UI', sans-serif;
/* Modern dark-themed mesh gradient background */
background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0f172a);
background-size: 400% 400%;
/* Handles the smooth moving background effect */
animation: gradientMove 15s ease infinite;
margin: 0;
padding: 20px;
display: flex;
align-items: center;
justify-content: center;
min-height: 90vh;
}

@keyframes gradientMove {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}

.container {
background: rgba(255, 255, 255, 0.07);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
padding: 40px 30px;
max-width: 600px;
width: 100%;
margin: auto;
border-radius: 16px;
border: 1px solid rgba(255, 255, 255, 0.1);
box-shadow: 0 20px 40px rgba(0,0,0,0.3);
text-align: center;
transition: transform 0.3s ease;
}

h2 {
color: #ffffff;
font-size: 28px;
font-weight: 600;
margin-top: 0;
margin-bottom: 25px;
letter-spacing: 0.5px;
text-shadow: 0 2px 4px rgba(0,0,0,0.2);
}

h3 {
color: #e2e8f0;
font-size: 20px;
font-weight: 500;
margin-bottom: 20px;
}

input {
padding: 12px 16px;
width: 260px;
border-radius: 8px;
border: 1px solid rgba(255, 255, 255, 0.2);
background: rgba(255, 255, 255, 0.05);
color: white;
font-size: 15px;
margin: 10px;
outline: none;
transition: 0.3s ease;
}

input::placeholder {
color: #94a3b8;
}

input:focus {
border-color: #38bdf8;
background: rgba(255, 255, 255, 0.1);
box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
}

button {
background: linear-gradient(135deg, #3b82f6, #1d4ed8);
color: white;
border: none;
padding: 12px 24px;
font-size: 16px;
font-weight: 500;
border-radius: 8px;
cursor: pointer;
margin: 8px;
box-shadow: 0 4px 6px rgba(0,0,0,0.1);
transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

button:hover {
background: linear-gradient(135deg, #60a5fa, #2563eb);
transform: translateY(-2px);
box-shadow: 0 6px 12px rgba(59, 130, 246, 0.3);
}

button:active {
transform: translateY(0);
}

.hidden {
display: none;
}

.section {
margin-top: 10px;
}

</style>

</head>

<body>

<div class="container">

<h2>DevOps Test Platform</h2>

<!-- STEP 1: USER INPUT -->
<div id="userForm" class="section">
<input type="text" id="name" placeholder="Enter Name">
<input type="text" id="surname" placeholder="Enter Surname">
<br>
<button onclick="goToSelection()">Next</button>
</div>

<!-- STEP 2: TEST SELECTION -->
<div id="testSelection" class="section hidden">
<h3>Select Test</h3>

<button onclick="selectTest('aws')">AWS Test</button>
<button onclick="selectTest('linux')">Linux Test</button>
<button onclick="selectTest('devops')">DevOps Test</button>

</div>

<!-- STEP 3: DEVOPS OPTIONS -->
<div id="devopsOptions" class="section hidden">
<h3>Select DevOps Tool</h3>

<button onclick="selectDevops('git')">Git</button>
<button onclick="selectDevops('docker')">Docker</button>
<button onclick="selectDevops('kubernetes')">Kubernetes</button>
<button onclick="selectDevops('terraform')">Terraform</button>
<button onclick="selectDevops('jenkins')">Jenkins</button>
<button onclick="selectDevops('all')">All DevOps</button>

</div>

<!-- STEP 4: START -->
<div id="startSection" class="section hidden">
<h3 id="selectedTestText"></h3>
<button onclick="startTest()">Start Test</button>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
