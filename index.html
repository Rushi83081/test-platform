<!DOCTYPE html>
<html lang="en">
<head>
<title>DevOps Test Platform</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Load Three.js core production library via official CDN for true WebGL 3D depth -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(-45deg, #070a12, #0f0d22, #180732, #070a12);
    background-size: 400% 400%;
    animation: gradientMove 15s ease infinite;
    margin: 0;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 95vh;
    overflow: hidden;
    color: #f8fafc;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    padding: 30px;
    max-width: 460px;
    width: 100%;
    margin: auto;
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.7);
    text-align: center;
    position: relative;
    z-index: 10;
}

h2 {
    font-size: 30px;
    margin: 0 0 20px 0;
    background: linear-gradient(to right, #38bdf8, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 800;
    letter-spacing: -0.5px;
}

h3 {
    color: #94a3b8;
    font-size: 19px;
    margin-bottom: 25px;
    font-weight: 500;
}

input {
    padding: 14px 18px;
    width: 82%;
    max-width: 320px;
    border-radius: 14px;
    border: 2px solid rgba(255, 255, 255, 0.06);
    background: rgba(5, 8, 16, 0.7);
    color: #fff;
    font-size: 16px;
    margin: 10px 0;
    outline: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
input::placeholder { color: #475569; }
input:focus {
    border-color: #38bdf8;
    background: rgba(5, 8, 16, 0.9);
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
}

button {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: white;
    border: none;
    padding: 14px 32px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
    margin: 8px;
    box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
button:hover {
    background: linear-gradient(135deg, #60a5fa, #2563eb);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(59, 130, 246, 0.35);
}

.hidden { display: none !important; }
.section { margin-top: 5px; }

/* 🌟 TRUE WEBGL 3D VIEWPORT ABOVE THE TASKBAR ZONE */
.canvas-3d-viewport {
    width: 100%;
    height: 200px;
    margin-top: 20px;
    position: relative;
    border-radius: 20px;
    background: radial-gradient(circle at center, rgba(56, 189, 248, 0.05) 0%, transparent 75%);
    overflow: hidden;
}
#threeJsCanvas {
    width: 100%;
    height: 100%;
    display: block;
}

#countdownOverlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(4, 6, 12, 0.98);
    backdrop-filter: blur(35px);
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
}
#countdownOverlay.active { opacity: 1; pointer-events: auto; }

.countdown-number {
    font-size: 140px;
    font-weight: 900;
    color: #38bdf8;
    text-shadow: 0 0 50px rgba(56, 189, 248, 0.4);
    animation: scalePulse 1s ease-in-out infinite;
}
@keyframes scalePulse {
    0% { transform: scale(0.5); opacity: 0; }
    30% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 0; }
}

.wish-text {
    font-size: 48px;
    font-weight: 900;
    background: linear-gradient(to right, #fbbf24, #f87171, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-top: 20px;
    letter-spacing: 1px;
    animation: textPop 0.5s ease forwards;
}
@keyframes textPop { 0% { transform: scale(0.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<div class="container">
    <h2>DevOps Test Platform</h2>

    <!-- STEP 1: USER INPUT -->
    <div id="userForm" class="section">
        <input type="text" id="name" placeholder="Enter Name" onfocus="trigger3DExpression('look-down')" onblur="trigger3DExpression('walk')">
        <input type="text" id="surname" placeholder="Enter Surname" onfocus="trigger3DExpression('look-down')" onblur="trigger3DExpression('walk')">
        <br>
        <button onclick="goToSelection()">Next</button>
    </div>

    <!-- STEP 2: MAIN TEST SELECTION MENU -->
    <div id="testSelection" class="section hidden">
        <h3>Select Test</h3>
        <button onclick="selectTest('aws')">AWS Test</button>
        <button onclick="selectTest('linux')">Linux Test</button>
        <button onclick="selectTest('devops')">DevOps Test</button>
    </div>

    <!-- STEP 3: DEVOPS SUBCATEGORY MENU -->
    <div id="devopsOptions" class="section hidden">
        <h3>Select DevOps Tool</h3>
        <button onclick="selectDevops('git')">Git</button>
        <button onclick="selectDevops('docker')">Docker</button>
        <button onclick="selectDevops('kubernetes')">Kubernetes</button>
        <button onclick="selectDevops('terraform')">Terraform</button>
        <button onclick="selectDevops('jenkins')">Jenkins</button>
        <button onclick="selectDevops('all')">All DevOps</button>
    </div>
    <!-- STEP 4: PRE-LAUNCH TEST SECTION -->
    <div id="startSection" class="section hidden">
        <h3 id="selectedTestText"></h3>
        <button onclick="startTest()">Start Test</button>
    </div>

    <!-- 🌟 TASKBAR REGION FOR TRUE 3D RENDER CANVAS -->
    <div class="canvas-3d-viewport">
        <div id="threeJsCanvas"></div>
    </div>
</div>

<!-- FULLSCREEN MOTIVATIONAL OVERLAY LAYER -->
<div id="countdownOverlay">
    <div id="countdownDisplay" class="countdown-number">3</div>
    <div id="wishTextDisplay" class="wish-text hidden">ALL THE BEST! 🚀</div>
</div>

<script src="script.js"></script>
<!-- =============================================================
     🎨 HIGH-FIDELITY WEBGL THREE.JS REAL 3D RIGGING CONTROLS
     ============================================================= -->
<script>
let scene, camera, renderer, characterGroup;
let headMesh, leftArm, rightArm, leftLeg, rightLeg;
let targetExpression = 'walk';
let globalAnimationTimer = 0;

function init3DCharacterEngine() {
    const containerElement = document.getElementById('threeJsCanvas');
    if (!containerElement) return;
    
    const displayWidth = containerElement.clientWidth || 400;
    const displayHeight = 200;

    // Create 3D Scene Landscape
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(45, displayWidth / displayHeight, 0.1, 1000);
    camera.position.set(0, 0.2, 5.5);

    // Setup WebGL 3D Render Engine Context
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(displayWidth, displayHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    containerElement.appendChild(renderer.domElement);

    // Dynamic Cinematic Studio Space Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
    directionalLight.position.set(5, 8, 5);
    scene.add(directionalLight);

    const backLighting = new THREE.DirectionalLight(0xa78bfa, 0.8);
    backLighting.position.set(-5, 3, -4);
    scene.add(backLighting);

    // Main 3D Structural Group Rig
    characterGroup = new THREE.Group();
    characterGroup.position.y = -1.3;
    scene.add(characterGroup);

    // Premium Material Textures Setup
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.4 });
    const hairMat = new THREE.MeshStandardMaterial({ color: 0x1a110e, roughness: 0.6 });
    const shirtMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
    const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.5 });
    const tieMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });
    const shoeMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });

    // 🧑 HEAD CORE (Pixar Aesthetic)
    const headGeo = new THREE.SphereGeometry(0.55, 32, 32);
    headGeo.scale(1, 1.08, 0.95);
    headMesh = new THREE.Mesh(headGeo, skinMat);
    headMesh.position.y = 1.95;
    characterGroup.add(headMesh);

    // Deep Handsome Eyes Setup
    const eyeGeo = new THREE.SphereGeometry(0.07, 16, 16);
    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
    leftEye.position.set(-0.18, 0.08, 0.48);
    headMesh.add(leftEye);

    const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
    rightEye.position.set(0.18, 0.08, 0.48);
    headMesh.add(rightEye);

    // Styled Academic Hair Layers
    const hairGeo = new THREE.SphereGeometry(0.58, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
    const hairTop = new THREE.Mesh(hairGeo, hairMat);
    hairTop.position.y = 0.06;
    headMesh.add(hairTop);

    const fringeGeo = new THREE.ConeGeometry(0.25, 0.4, 16);
    const hairFringe = new THREE.Mesh(fringeGeo, hairMat);
    hairFringe.position.set(0.08, 0.48, 0.35);
    hairFringe.rotation.set(0.4, 0, -0.5);
    headMesh.add(hairFringe);

    // 👔 TORSO SUIT MESH (Tailored White Shirt + Red Tie Combo)
    const torsoGeo = new THREE.CylinderGeometry(0.42, 0.34, 1.1, 32);
    const torsoMesh = new THREE.Mesh(torsoGeo, shirtMat);
    torsoMesh.position.y = 1.05;
    characterGroup.add(torsoMesh);

    const tieGeo = new THREE.BoxGeometry(0.09, 0.5, 0.04);
    const tieMesh = new THREE.Mesh(tieGeo, tieMat);
    tieMesh.position.set(0, 0.18, 0.4);
    tieMesh.rotation.x = 0.06;
    torsoMesh.add(tieMesh);

    // 👖 PANTS MESH (Blue Pants Geometry Base)
    const pantsGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.35, 32);
    const pantsMesh = new THREE.Mesh(pantsGeo, pantsMat);
    pantsMesh.position.y = 0.38;
    characterGroup.add(pantsMesh);

    // 🦵 BALANCED LIMBS SYSTEM
    const limbGeo = new THREE.CylinderGeometry(0.11, 0.09, 0.7, 16);
    
    // Left Leg Node
    leftLeg = new THREE.Group();
    leftLeg.position.set(-0.18, 0.25, 0);
    characterGroup.add(leftLeg);
    const leftLegMesh = new THREE.Mesh(limbGeo, pantsMat);
    leftLegMesh.position.y = -0.35;
    leftLeg.add(leftLegMesh);
    const leftFoot = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.11, 0.26), shoeMat);
    leftFoot.position.set(0, -0.7, 0.06);
    leftLeg.add(leftFoot);

    // Right Leg Node
    rightLeg = new THREE.Group();
    rightLeg.position.set(0.18, 0.25, 0);
    characterGroup.add(rightLeg);
    const rightLegMesh = new THREE.Mesh(limbGeo, pantsMat);
    rightLegMesh.position.y = -0.35;
    rightLeg.add(rightLegMesh);
    const rightFoot = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.11, 0.26), shoeMat);
    rightFoot.position.set(0, -0.7, 0.06);
    rightLeg.add(rightFoot);

    // Left Arm Node
    leftArm = new THREE.Group();
    leftArm.position.set(-0.52, 1.45, 0);
    characterGroup.add(leftArm);
    const leftArmMesh = new THREE.Mesh(limbGeo, shirtMat);
    leftArmMesh.position.y = -0.35;
    leftArm.add(leftArmMesh);
    const leftHand = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), skinMat);
    leftHand.position.y = -0.7;
    leftArm.add(leftHand);

    // Right Arm Node
    rightArm = new THREE.Group();
    rightArm.position.set(0.52, 1.45, 0);
    characterGroup.add(rightArm);
    const rightArmMesh = new THREE.Mesh(limbGeo, shirtMat);
    rightArmMesh.position.y = -0.35;
    rightArm.add(rightArmMesh);
    const rightHand = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), skinMat);
    rightHand.position.y = -0.7;
    rightArm.add(rightHand);

    animateWebGLUniverseLoop();
}

function trigger3DExpression(poseType) {
    targetExpression = poseType;
}

function animateWebGLUniverseLoop() {
    requestAnimationFrame(animateWebGLUniverseLoop);
    globalAnimationTimer += 0.05;

    if (headMesh) {
        headMesh.rotation.y = Math.sin(globalAnimationTimer * 0.4) * 0.04;
        headMesh.position.y = 1.95 + Math.sin(globalAnimationTimer * 0.8) * 0.015;
    }

    let smoothTransitionRate = 0.18;

    if (targetExpression === 'walk' && leftLeg && rightLeg && leftArm && rightArm && headMesh) {
        leftLeg.rotation.x = Math.sin(globalAnimationTimer * 1.6) * 0.45;
        rightLeg.rotation.x = -Math.sin(globalAnimationTimer * 1.6) * 0.45;
        leftArm.rotation.x = -Math.sin(globalAnimationTimer * 1.6) * 0.35;
        rightArm.rotation.x = Math.sin(globalAnimationTimer * 1.6) * 0.35;
        
        leftArm.rotation.z = THREE.MathUtils.lerp(leftArm.rotation.z, -0.08, smoothTransitionRate);
        rightArm.rotation.z = THREE.MathUtils.lerp(rightArm.rotation.z, 0.08, smoothTransitionRate);
        headMesh.rotation.x = THREE.MathUtils.lerp(headMesh.rotation.x, 0, smoothTransitionRate);
        characterGroup.position.y = -1.3 + Math.abs(Math.sin(globalAnimationTimer * 1.6)) * 0.04;
    } 
    else if (targetExpression === 'look-down' && headMesh && leftArm && rightArm && leftLeg && rightLeg) {
        headMesh.rotation.x = THREE.MathUtils.lerp(headMesh.rotation.x, 0.26, smoothTransitionRate);
        leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0.08, smoothTransitionRate);
        rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, 0.08, smoothTransitionRate);
        leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0, smoothTransitionRate);
        rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, smoothTransitionRate);
    } 
    else if (targetExpression === 'thinking' && headMesh && leftArm && rightArm && leftLeg && rightLeg) {
        headMesh.rotation.x = THREE.MathUtils.lerp(headMesh.rotation.x, -0.08, smoothTransitionRate);
        headMesh.rotation.y = THREE.MathUtils.lerp(headMesh.rotation.y, -0.22, smoothTransitionRate);
        leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, -0.35, smoothTransitionRate);
        leftArm.rotation.z = THREE.MathUtils.lerp(leftArm.rotation.z, 0.25, smoothTransitionRate);
        rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, -1.65, smoothTransitionRate);
        rightArm.rotation.y = THREE.MathUtils.lerp(rightArm.rotation.y, -0.5, smoothTransitionRate);
        leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0.08, smoothTransitionRate);
        rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, -0.08, smoothTransitionRate);
    } 
    else if (targetExpression === 'thumbs-up' && headMesh && leftArm && rightArm && leftLeg && rightLeg) {
        headMesh.rotation.x = THREE.MathUtils.lerp(headMesh.rotation.x, -0.02, smoothTransitionRate);
        headMesh.rotation.y = THREE.MathUtils.lerp(headMesh.rotation.y, 0, smoothTransitionRate);
        leftArm.rotation.x = THREE.MathUtils.lerp(leftArm.rotation.x, 0.15, smoothTransitionRate);
        leftArm.rotation.z = THREE.MathUtils.lerp(leftArm.rotation.z, -0.15, smoothTransitionRate);
        rightArm.rotation.x = THREE.MathUtils.lerp(rightArm.rotation.x, -2.0, smoothTransitionRate);
        rightArm.rotation.z = THREE.MathUtils.lerp(rightArm.rotation.z, -0.35, smoothTransitionRate);
        leftLeg.rotation.x = THREE.MathUtils.lerp(leftLeg.rotation.x, 0, smoothTransitionRate);
        rightLeg.rotation.x = THREE.MathUtils.lerp(rightLeg.rotation.x, 0, smoothTransitionRate);
    }

    if (renderer && scene && camera) {
        renderer.render(scene, camera);
    }
}

window.addEventListener('resize', () => {
    const targetBox = document.getElementById('threeJsCanvas');
    if (!targetBox || !camera || !renderer) return;
    const w = targetBox.clientWidth;
    camera.aspect = w / 200;
    camera.updateProjectionMatrix();
    renderer.setSize(w, 200);
});

window.addEventListener('load', init3DCharacterEngine);
</script>
</body>
